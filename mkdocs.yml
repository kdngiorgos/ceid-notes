site_name: CEID Notes
site_url: https://ceid.gr/
repo_url: https://github.com/kdngiorgos/ceid-notes
repo_name: kdngiorgos/ceid-notes
site_description: Κοινόχρηστο αρχείο γνώσης για τα μαθήματα του Τμήματος Μηχανικών Η/Υ & Πληροφορικής (Πανεπιστήμιο Πατρών)
docs_dir: docs
site_dir: site
use_directory_urls: false
theme:
  name: material
  language: el
  font: false
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Σκούρο θέμα
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Φωτεινό θέμα
plugins:
  - search:
      lang: [el, en]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kdngiorgos/ceid-notes
      name: GitHub
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/greek-search.js
  - javascripts/analytics.js
  - javascripts/translate.js?v=3
  - javascripts/contribute.js?v=1
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
validation:
  nav:
    omitted_files: ignore
  links:
    anchors: ignore
    not_found: info

