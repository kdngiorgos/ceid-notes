name: check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - run: pip install -r tools/requirements-ci.txt
      - name: Unit tests of the checker
        run: python -m pytest tools -q
      - name: Check changed files
        id: check
        env:
          BASE: origin/${{ github.base_ref }}
          IS_kdngiorgos: ${{ github.event.pull_request.user.login == github.repository_owner }}
        run: |
          kdngiorgos_FLAG=""
          if [ "$IS_kdngiorgos" = "true" ]; then kdngiorgos_FLAG="--owner"; fi
          python tools/check_contribution.py --base "$BASE" $kdngiorgos_FLAG --summary-file "$RUNNER_TEMP/summary.md" \
            || echo "failed=true" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Post summary comment
        # Pull requests from forks get a read-only token, so commenting is best effort; the summary above always exists.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ceid-notes-check -->';
            const body = marker + '\n' + fs.readFileSync(process.env.SUMMARY_FILE, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Fail if the checks failed
        if: steps.check.outputs.failed == 'true'
        run: exit 1
